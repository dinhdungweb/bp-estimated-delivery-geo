# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "fdf944db46b40d63062eb6d9b5abe80c"
name = "BP: Estimated Delivery Pro"
application_url = "https://estimated-delivery.bluepeaks.top"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2024-10"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[webhooks.compliance]
customer_data_request_url = "https://estimated-delivery.bluepeaks.top/webhooks/customers/data_request"
customer_redact_url = "https://estimated-delivery.bluepeaks.top/webhooks/customers/redact"
shop_redact_url = "https://estimated-delivery.bluepeaks.top/webhooks/customers/redact"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,read_orders,read_products,read_themes,read_markets"

[auth]
redirect_urls = [ "https://estimated-delivery.bluepeaks.top/auth/callback" ]

[app_proxy]
url = "https://estimated-delivery.bluepeaks.top/apps/bp-delivery"
subpath = "bp-delivery"
prefix = "apps"
